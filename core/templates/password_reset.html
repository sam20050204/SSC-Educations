<!DOCTYPE html>
<html>
<head>
    <title>Password Reset</title>
</head>
<body>
    <h2>Reset Password</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.email }}
        <br><br>
        <button type="submit">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}">Back to Login</a>
</body>
</html>
