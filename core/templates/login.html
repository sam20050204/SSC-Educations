<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | SSC Educations</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial;
}
body{
    min-height:100vh;
    background:linear-gradient(to right,#0a014f,#1b1b8f);
    display:flex;
    align-items:center;
    justify-content:center;
}
.login-container{
    background:#fff;
    width:90%;
    max-width:380px;
    padding:35px 30px;
    border-radius:12px;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}
.login-container h2{
    text-align:center;
    color:#0a014f;
    margin-bottom:8px;
}
.login-container p{
    text-align:center;
    font-size:14px;
    color:#666;
    margin-bottom:22px;
}
.login-container input{
    width:100%;
    padding:12px;
    margin-bottom:14px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}
.password-box{
    position:relative;
}
.toggle{
    position:absolute;
    right:12px;
    top:12px;
    cursor:pointer;
    font-size:14px;
    color:#1b1b8f;
}
.login-btn{
    width:100%;
    background:#ff4500;
    color:#fff;
    padding:12px;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}
.login-btn:hover{
    background:#e03d00;
}
.error{
    background:#ffe0e0;
    color:#b30000;
    padding:10px;
    border-radius:5px;
    font-size:14px;
    margin-bottom:15px;
    text-align:center;
}
.links{
    text-align:center;
    margin-top:18px;
}
.links a{
    text-decoration:none;
    color:#1b1b8f;
    font-size:14px;
}
</style>
</head>

<body>

{% if messages %}
    {% for message in messages %}
        <div class="toast">{{ message }}</div>
    {% endfor %}
{% endif %}

<div class="login-container">

    <h2>SSC Educations</h2>
    <p>Login to access the system</p>

    {% if form.errors %}
        <div class="error">
            Invalid username or password
        </div>
    {% endif %}

    <!-- ✅ FIXED FORM -->
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>

        <div class="password-box">
            <input type="password" name="password" id="password" placeholder="Password" required>
            <span class="toggle" onclick="togglePassword()">Show</span>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="links">
        <!-- OPTIONAL: remove if 'home' URL does not exist -->
        <!-- <a href="{% url 'home' %}">← Back to Home</a> -->
    </div>

</div>

<script>
function togglePassword(){
    const p=document.getElementById("password");
    const t=document.querySelector(".toggle");
    if(p.type==="password"){
        p.type="text";
        t.innerText="Hide";
    }else{
        p.type="password";
        t.innerText="Show";
    }
}
</script>

</body>
</html>
